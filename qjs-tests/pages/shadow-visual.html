<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>box-shadow</title>
<style>
body { font: 13px sans-serif; margin: 20px; background: #f4f4f4; }
.b { display: inline-block; vertical-align: top; width: 150px; height: 70px; margin: 0 30px 40px 0; background: #fff; padding: 6px; }
.s1 { box-shadow: 0 2px 8px #22262e40; }
.s2 { box-shadow: 4px 4px 0 #000; }
.s3 { box-shadow: 0 0 0 4px #4a90e2; }
.s4 { box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.2); }
.s5 { box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); }
.s6 { box-shadow: -6px -6px 12px red; }
.s7 { box-shadow: 0 0 16px 4px rgba(255,165,0,0.8); border: 2px solid #c80; }
.search { display: inline-flex; width: 400px; box-shadow: var(--sh); border-radius: .8rem; }
:root { --sh: 0 2px 8px #22262e40; }
.search input { flex: 1; border: none; padding: .8rem 1rem; background: #fff; font-size: 1.1rem; }
.search button { border: none; background: #fff; padding: .8rem; }
</style></head><body>
<div class="b s1">SearXNG: 0 2px 8px</div>
<div class="b s2">4px 4px 0 black</div>
<div class="b s3">spread ring</div>
<div class="b s4">two layers</div>
<div class="b s5">inset</div>
<div class="b s6">negative offset</div>
<div class="b s7">glow + border</div>
<p></p>
<div class="search"><input type="text" placeholder="Search for..."><button>search</button></div>
</body></html>
