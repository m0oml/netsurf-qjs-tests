<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>background-size</title>
<style>
body { font: 13px sans-serif; margin: 10px; }
.b { display: inline-block; vertical-align: top; margin: 0 10px 22px 0; border: 1px solid #999;
     background-image: url(rb2x1.png); background-color: #ffc; }
.b span { display: block; position: relative; top: 100%; font-size: 11px; }
.title { background: url(rb2x1.png) 50%/contain no-repeat; min-height: 4rem; margin: 1rem auto; border: 1px dashed #999; }
</style></head><body>
<div class="b" style="width:200px;height:100px;background-repeat:no-repeat;background-size:cover"></div>
<div class="b" style="width:200px;height:150px;background-repeat:no-repeat;background-size:contain;background-position:50% 50%"></div>
<div class="b" style="width:200px;height:100px;background-size:50px auto"></div>
<div class="b" style="width:150px;height:60px;background-repeat:no-repeat;background-size:100% 100%"></div>
<div class="b" style="width:200px;height:100px;background:#ffc url(rb2x1.png) center / 80px 40px no-repeat"></div>
<div class="b" style="width:200px;height:100px;background-repeat:no-repeat;background-size:auto 30px"></div>
<div class="b" style="width:200px;height:100px;background-repeat:no-repeat"></div>
<div class="title"></div>
<p>Rows: cover; contain centred; 50px tiles; 100% 100%; shorthand 80x40 centred; auto 30px; no size (20x10); SearXNG title (contain, centred).</p>
</body></html>
