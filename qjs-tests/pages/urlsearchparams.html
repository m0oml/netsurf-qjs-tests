<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>usp</title></head><body><script>
function check(name, fn) {
  try { var r = fn(); console.log((r === true ? "PASS " : "FAIL ") + name + (r === true ? "" : " got " + r)); }
  catch (e) { console.log("FAIL " + name + " threw " + e); }
}
const eq = (a, b) => a === b ? true : JSON.stringify(a) + " != " + JSON.stringify(b);
check("parse string", () => { const p = new URLSearchParams("?a=1&b=2&a=3"); return eq(p.get("a") + p.getAll("a").join() + p.get("b") + p.get("z"), "11,32null"); });
check("plus and percent", () => eq(new URLSearchParams("q=a+b%20c%26").get("q"), "a b c&"));
check("serialize", () => { const p = new URLSearchParams(); p.append("a b", "c&d=é"); return eq(p.toString(), "a+b=c%26d%3D%C3%A9"); });
check("from object", () => eq(new URLSearchParams({ x: 1, y: "two" }).toString(), "x=1&y=two"));
check("from pairs", () => eq(new URLSearchParams([["a", "1"], ["a", "2"]]).toString(), "a=1&a=2"));
check("set replaces", () => { const p = new URLSearchParams("a=1&b=2&a=3"); p.set("a", "9"); return eq(p.toString(), "a=9&b=2"); });
check("delete", () => { const p = new URLSearchParams("a=1&b=2&a=3"); p.delete("a"); return eq(p.toString(), "b=2"); });
check("delete with value", () => { const p = new URLSearchParams("a=1&a=2"); p.delete("a", "1"); return eq(p.toString(), "a=2"); });
check("has", () => { const p = new URLSearchParams("a=1"); return p.has("a") && !p.has("b") && p.has("a", "1") && !p.has("a", "2"); });
check("sort stable", () => { const p = new URLSearchParams("c=1&a=2&b=3&a=1"); p.sort(); return eq(p.toString(), "a=2&a=1&b=3&c=1"); });
check("iterate", () => eq([...new URLSearchParams("a=1&b=2")].map(([k, v]) => k + v).join(), "a1,b2"));
check("keys values entries forEach size", () => { const p = new URLSearchParams("a=1&b=2"); let f = ""; p.forEach((v, k) => { f += k + v; }); return eq([...p.keys()].join() + [...p.values()].join() + f + p.size, "a,b1,2a1b22"); });
check("url.searchParams", () => { const u = new URL("https://x.test/p?a=1"); return eq(u.searchParams.get("a"), "1"); });
check("searchParams updates url", () => { const u = new URL("https://x.test/p?a=1#h"); u.searchParams.append("b", "2 3"); return eq(u.href, "https://x.test/p?a=1&b=2+3#h"); });
check("search updates params", () => { const u = new URL("https://x.test/"); u.search = "?z=9"; return eq(u.searchParams.get("z"), "9"); });
check("clearing params removes ?", () => { const u = new URL("https://x.test/?a=1"); u.searchParams.delete("a"); return eq(u.href, "https://x.test/"); });
check("relative URL", () => eq(new URL("../c?d#e", "https://a.test/b/x/y").href, "https://a.test/b/c?d#e"));
check("URL with base URL object", () => eq(new URL("/q", new URL("https://a.test/z")).href, "https://a.test/q"));
check("origin", () => eq(new URL("https://a.test:8443/x").origin, "https://a.test:8443"));
check("invalid throws TypeError", () => { try { new URL("no scheme"); return "no"; } catch (e) { return e instanceof TypeError; } });
check("canParse", () => URL.canParse("https://a") && !URL.canParse("x"));
check("toString/JSON", () => { const u = new URL("https://a.test"); return eq(String(u) + JSON.stringify({ u }), 'https://a.test/{"u":"https://a.test/"}'); });
check("toStringTag", () => eq(Object.prototype.toString.call(new URL("https://a")), "[object URL]"));
console.log("DONE");
</script></body></html>
