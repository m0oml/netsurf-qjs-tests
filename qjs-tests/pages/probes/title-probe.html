<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
.t1 { background: url(../rb2x1.png) 50%/contain no-repeat; min-height: 4rem; margin: 1rem auto; }
.t2 { min-height: 4rem; }
.t3 { min-height: 64px; }
.t4 { background: url(../rb2x1.png) 50%/contain no-repeat; height: 64px; }
</style></head><body>
<div class="t1" id="t1"></div><div class="t2" id="t2"></div><div class="t3" id="t3"></div><div class="t4" id="t4"></div>
<script>
window.addEventListener("load", () => setTimeout(() => {
  for (const id of ["t1", "t2", "t3", "t4"]) {
    const e = document.getElementById(id), r = e.getBoundingClientRect();
    console.log(id, Math.round(r.width) + "x" + Math.round(r.height));
  }
  console.log("DONE");
}, 500));
</script></body></html>
